<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rendez-vous avant le conseil de classe</title>
<style>
  :root {
    --bg: #f6f5f1; --card: #ffffff; --ink: #1d1d1b; --muted: #6b6a65;
    --line: #e4e2db; --accent: #2f5bd3; --accent-ink: #ffffff; --accent-soft: #e8eefc;
    --ok: #1f7a4d; --ok-soft: #e3f3ea; --err: #b3261e; --err-soft: #fbe9e7;
    --radius: 14px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  main { max-width: 640px; margin: 0 auto; padding: 28px 18px 60px; }
  h1 { font-size: 1.55rem; line-height: 1.25; margin: 0 0 6px; letter-spacing: -0.01em; }
  .sub { color: var(--muted); margin: 0 0 22px; }
  .banner { border-radius: var(--radius); padding: 14px 16px; margin-bottom: 18px; }
  .banner.demo { background: #fff6dd; border: 1px solid #f0dc9c; font-size: .92rem; }
  .banner.mine { background: var(--ok-soft); border: 1px solid #bfe3cf; }
  .banner.mine strong { color: var(--ok); }
  .day { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; margin-bottom: 14px; }
  .day h2 { font-size: 1.05rem; margin: 0 0 12px; }
  .day h2 small { color: var(--muted); font-weight: 400; font-size: .85rem; margin-left: 6px; }
  .slots { display: grid; grid-template-columns: repeat(auto-fill, minmax(88px, 1fr)); gap: 8px; }
  .slot {
    appearance: none; border: 1.5px solid var(--accent); background: var(--card); color: var(--accent);
    border-radius: 10px; padding: 11px 4px; font: inherit; font-weight: 600; cursor: pointer;
    transition: background .12s, color .12s, transform .08s;
  }
  .slot:hover { background: var(--accent-soft); }
  .slot:active { transform: scale(.97); }
  .slot:focus-visible { outline: 3px solid var(--accent-soft); outline-offset: 2px; }
  .slot[disabled] {
    border-color: var(--line); color: #b0aea7; background: #f1f0ec; cursor: not-allowed;
    text-decoration: line-through; font-weight: 400;
  }
  .status { text-align: center; color: var(--muted); padding: 40px 0; }
  .status button, .link { background: none; border: 0; color: var(--accent); font: inherit; cursor: pointer; text-decoration: underline; padding: 0; }
  .empty { text-align: center; color: var(--muted); background: var(--card); border: 1px dashed var(--line); border-radius: var(--radius); padding: 30px 16px; }

  /* Fenêtre de réservation */
  .overlay {
    position: fixed; inset: 0; background: rgba(20,20,18,.45); display: none;
    align-items: flex-end; justify-content: center; z-index: 10;
  }
  .overlay.open { display: flex; }
  .sheet {
    background: var(--card); width: 100%; max-width: 480px; border-radius: 20px 20px 0 0;
    padding: 22px 20px 26px; box-shadow: 0 -10px 40px rgba(0,0,0,.15);
  }
  @media (min-width: 560px) { .overlay { align-items: center; } .sheet { border-radius: 20px; } }
  .sheet h3 { margin: 0 0 4px; font-size: 1.2rem; }
  .sheet .when { color: var(--accent); font-weight: 600; margin: 0 0 16px; }
  .sheet label { display: block; font-size: .9rem; color: var(--muted); margin-bottom: 6px; }
  .sheet input {
    width: 100%; font: inherit; font-size: 1.1rem; padding: 12px 14px; border-radius: 10px;
    border: 1.5px solid var(--line); outline: none;
  }
  .sheet input:focus { border-color: var(--accent); }
  .actions { display: flex; gap: 10px; margin-top: 16px; }
  .btn { flex: 1; font: inherit; font-weight: 600; padding: 13px; border-radius: 10px; border: 0; cursor: pointer; }
  .btn.primary { background: var(--accent); color: var(--accent-ink); }
  .btn.primary[disabled] { opacity: .6; cursor: wait; }
  .btn.ghost { background: #efeee9; color: var(--ink); flex: 0 0 auto; padding: 13px 18px; }
  .msg { margin-top: 12px; padding: 10px 12px; border-radius: 10px; font-size: .92rem; display: none; }
  .msg.err { display: block; background: var(--err-soft); color: var(--err); }

  /* Confirmation */
  .done { text-align: center; padding: 8px 0 4px; }
  .done .check {
    width: 64px; height: 64px; border-radius: 50%; background: var(--ok-soft); color: var(--ok);
    display: grid; place-items: center; font-size: 34px; margin: 0 auto 12px;
  }
  .done h3 { margin-bottom: 8px; }
  .done p { margin: 0 0 4px; }
  .done .big { font-size: 1.15rem; font-weight: 700; color: var(--ok); margin: 6px 0 14px; }
</style>
</head>
<body>
<main>
  <h1 id="titre"></h1>
  <p class="sub" id="soustitre"></p>
  <div id="bannieres"></div>
  <div id="liste"><p class="status">Chargement des créneaux…</p></div>
</main>

<div class="overlay" id="overlay" role="dialog" aria-modal="true" aria-labelledby="fen-titre">
  <div class="sheet" id="sheet"></div>
</div>

<script>
/* ============================================================
   CONFIGURATION — à modifier
   ============================================================ */
const CONFIG = {
  // Collez ici l'adresse de l'application Web Google (se termine par /exec).
  // Laissez vide pour tester la page en mode démonstration.
  url: 'https://script.google.com/macros/s/AKfycbys1yzkm4J_CDZxrvUdkEqiI57nolZY-yb2kjC_F4IjovXMgQDxoDh9gW-z9U5qKBb_/exec',
  titre: 'Rendez-vous avant le conseil de classe',
  sousTitre: 'Clique sur un créneau libre, écris ton prénom, c\'est réservé.'
};
/* ============================================================ */

const DEMO = !CONFIG.url;
const CLE_LOCALE = 'rdv-conseil:' + (CONFIG.url || 'demo');
const $ = (id) => document.getElementById(id);
let creneaux = [];
let choix = null;
let envoiEnCours = false;

document.title = CONFIG.titre;
$('titre').textContent = CONFIG.titre;
$('soustitre').textContent = CONFIG.sousTitre;

/* ---------- Mémoire locale (le rendez-vous de l'élève sur cet appareil) ---------- */
function lireMonRdv() { try { return JSON.parse(localStorage.getItem(CLE_LOCALE)); } catch (e) { return null; } }
function enregistrerMonRdv(r) { try { localStorage.setItem(CLE_LOCALE, JSON.stringify(r)); } catch (e) {} }

/* ---------- Accès aux données ---------- */
const demoData = (() => {
  const l = []; let id = 2;
  for (const jour of ['Lundi 30 novembre', 'Mardi 1er décembre']) {
    for (let m = 16 * 60 + 30; m < 18 * 60; m += 10) {
      l.push({ id: id++, jour, heure: Math.floor(m / 60) + 'h' + String(m % 60).padStart(2, '0'), libre: Math.random() > 0.3, prenom: '' });
    }
  }
  return l;
})();

async function api(methode, corps) {
  if (DEMO) {
    await new Promise(r => setTimeout(r, 350));
    if (methode === 'GET') return { ok: true, creneaux: demoData.map(({ prenom, ...c }) => c) };
    const c = demoData.find(x => x.id === corps.id);
    if (!c || !c.libre) return { ok: false, code: 'pris', erreur: 'Oups, ce créneau vient d\'être pris. Choisis-en un autre.' };
    c.libre = false; c.prenom = corps.prenom;
    return { ok: true, jour: c.jour, heure: c.heure, prenom: corps.prenom };
  }
  const options = methode === 'GET'
    ? { method: 'GET' }
    // Pas d'en-tête Content-Type : la requête reste « simple » et passe sans souci vers Google.
    : { method: 'POST', body: JSON.stringify(corps) };
  const url = methode === 'GET' ? CONFIG.url + (CONFIG.url.includes('?') ? '&' : '?') + 't=' + Date.now() : CONFIG.url;
  const rep = await fetch(url, options);
  if (!rep.ok) throw new Error('HTTP ' + rep.status);
  return rep.json();
}

/* ---------- Affichage ---------- */
function afficherBannieres() {
  const b = $('bannieres');
  b.replaceChildren();
  if (DEMO) {
    const d = document.createElement('div');
    d.className = 'banner demo';
    d.textContent = 'Mode démonstration : les réservations ne sont pas enregistrées. Ajoutez l\'adresse du script Google dans CONFIG.url pour activer la page.';
    b.append(d);
  }
  const mien = lireMonRdv();
  if (mien) {
    const d = document.createElement('div');
    d.className = 'banner mine';
    const s = document.createElement('strong');
    s.textContent = mien.jour + ' à ' + mien.heure;
    d.append('✓ ' + mien.prenom + ', ton rendez-vous est réservé : ', s, '.');
    b.append(d);
  }
}

function afficherListe() {
  const liste = $('liste');
  liste.replaceChildren();
  if (!creneaux.length) {
    const p = document.createElement('div');
    p.className = 'empty';
    p.textContent = 'Aucun créneau n\'est proposé pour le moment. Reviens un peu plus tard !';
    liste.append(p);
    return;
  }
  const jours = new Map();
  for (const c of creneaux) {
    if (!jours.has(c.jour)) jours.set(c.jour, []);
    jours.get(c.jour).push(c);
  }
  for (const [jour, cs] of jours) {
    const bloc = document.createElement('section');
    bloc.className = 'day';
    const h = document.createElement('h2');
    h.textContent = jour;
    const libres = cs.filter(c => c.libre).length;
    const small = document.createElement('small');
    small.textContent = libres === 0 ? 'complet' : libres + (libres > 1 ? ' créneaux libres' : ' créneau libre');
    h.append(small);
    const grille = document.createElement('div');
    grille.className = 'slots';
    for (const c of cs) {
      const btn = document.createElement('button');
      btn.className = 'slot';
      btn.type = 'button';
      btn.textContent = c.heure;
      if (c.libre) {
        btn.setAttribute('aria-label', 'Réserver ' + jour + ' à ' + c.heure);
        btn.addEventListener('click', () => ouvrir(c));
      } else {
        btn.disabled = true;
        btn.setAttribute('aria-label', jour + ' à ' + c.heure + ' : déjà pris');
      }
      grille.append(btn);
    }
    bloc.append(h, grille);
    liste.append(bloc);
  }
}

async function charger() {
  let minuteur;
  try {
    const delai = new Promise((_, rej) => { minuteur = setTimeout(() => rej(new Error('délai')), 20000); });
    const r = await Promise.race([api('GET'), delai]);
    if (!r.ok) throw new Error(r.erreur || 'erreur');
    creneaux = r.creneaux;
    afficherListe();
  } catch (e) {
    const liste = $('liste');
    liste.replaceChildren();
    const p = document.createElement('p');
    p.className = 'status';
    const btn = document.createElement('button');
    btn.textContent = 'Réessayer';
    btn.addEventListener('click', () => { liste.innerHTML = '<p class="status">Chargement des créneaux…</p>'; charger(); });
    p.append('Impossible de charger les créneaux. ', btn);
    liste.append(p);
  } finally {
    clearTimeout(minuteur);
  }
}

/* ---------- Fenêtre de réservation ---------- */
function ouvrir(c) {
  choix = c;
  const sheet = $('sheet');
  sheet.innerHTML = `
    <h3 id="fen-titre">Réserver ce créneau</h3>
    <p class="when"></p>
    <form id="form" autocomplete="off">
      <label for="prenom">Ton prénom</label>
      <input id="prenom" name="prenom" maxlength="40" required autocapitalize="words" enterkeyhint="done">
      <div class="msg" id="msg" role="alert"></div>
      <div class="actions">
        <button type="button" class="btn ghost" id="annuler">Annuler</button>
        <button type="submit" class="btn primary" id="valider">Réserver</button>
      </div>
    </form>`;
  sheet.querySelector('.when').textContent = c.jour + ' · ' + c.heure;
  const mien = lireMonRdv();
  if (mien) $('prenom').value = mien.prenom;
  $('annuler').addEventListener('click', fermer);
  $('form').addEventListener('submit', reserver);
  $('overlay').classList.add('open');
  setTimeout(() => $('prenom').focus(), 30);
}

function fermer() {
  if (envoiEnCours) return;
  $('overlay').classList.remove('open');
  choix = null;
}

async function reserver(ev) {
  ev.preventDefault();
  if (envoiEnCours || !choix) return;
  const prenom = $('prenom').value.replace(/\s+/g, ' ').trim();
  const msg = $('msg');
  if (!prenom) { msg.textContent = 'Écris ton prénom.'; msg.className = 'msg err'; return; }
  envoiEnCours = true;
  const btn = $('valider');
  btn.disabled = true; btn.textContent = 'Envoi…';
  msg.className = 'msg';
  try {
    const r = await api('POST', { id: choix.id, jour: choix.jour, heure: choix.heure, prenom });
    if (r.ok) {
      enregistrerMonRdv({ prenom: r.prenom, jour: r.jour, heure: r.heure });
      confirmer(r);
      charger();
      afficherBannieres();
    } else {
      msg.textContent = r.erreur || 'Impossible de réserver.';
      msg.className = 'msg err';
      if (r.code === 'pris' || r.code === 'change') charger();
    }
  } catch (e) {
    msg.textContent = 'Connexion impossible. Vérifie ta connexion internet et réessaie.';
    msg.className = 'msg err';
  } finally {
    envoiEnCours = false;
    if (document.body.contains(btn)) { btn.disabled = false; btn.textContent = 'Réserver'; }
  }
}

function confirmer(r) {
  const sheet = $('sheet');
  sheet.innerHTML = `
    <div class="done">
      <div class="check" aria-hidden="true">✓</div>
      <h3 id="fen-titre">C'est réservé !</h3>
      <p class="qui"></p>
      <p class="big"></p>
      <button type="button" class="btn primary" id="ok" style="width:100%">Parfait</button>
    </div>`;
  sheet.querySelector('.qui').textContent = 'Merci ' + r.prenom + ', ton rendez-vous :';
  sheet.querySelector('.big').textContent = r.jour + ' à ' + r.heure;
  $('ok').addEventListener('click', fermer);
  $('ok').focus();
}

$('overlay').addEventListener('click', (e) => { if (e.target.id === 'overlay') fermer(); });
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') fermer(); });

afficherBannieres();
charger();
</script>
</body>
</html>
